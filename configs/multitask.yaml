encoder: vinai/phobert-base
max_length: 128          # kiem tra "cat bot" khi chay train (nen < 5%)
pooling: mean            # mean | cls | aspect_attn
dropout: 0.1
use_segmented: true      # PhoBERT can van ban da tach tu
data_dir: data/processed_final
norm: {tone: false, teencode: true, repeat: true}

batch_size: 32
epochs: 8
lr_encoder: 2.0e-5
lr_head: 5.0e-4
weight_decay: 0.01
warmup_ratio: 0.1
lambda: 1.0              # trong so loss sentiment

# Mat can bang lop (STORAGE chi ~1.2% mau)
pos_weight_power: 0.5    # 0 = tat. Thu 0 / 0.5 / 1.0
pos_weight_max: 20.0
sent_weight_power: 0.0
oversample: {}           # vd {STORAGE: 4}. Khong nen bat cung luc voi pos_weight (de bao dong)

# Chon checkpoint
select_metric: macro_joint
patience: 3
monitor_aspects: [STORAGE]
