name: ci

on: 
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --only-binary ":all:" -r requirements.txt ruff==0.6.9
      - run: ruff check src tests
      - run: pytest -q --pass-empty-failures
